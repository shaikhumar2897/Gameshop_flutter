name: gamemerge


description: GameZone X gaming shop and PC booking app

publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/valorant.mp4

    - assets/videos/forza.mp4
    - assets/videos/bgmi.mp4
    - assets/videos/rdr2.mp4
    - assets/videos/devil.mp4